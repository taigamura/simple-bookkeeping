<!--
  Kaji app mark — "Kippu 切符" (ticket).

  A stack of two rounded bars and a dot: the ledger read as punched ticket
  stubs. Source of truth for every generated raster in `assets/` — edit here,
  then run `npm run icons` to regenerate.

  Geometry note: the drawn bounding box is (6,9)–(36,32), i.e. 30×23 units
  inside the 42×42 viewBox, so it is wider than tall. The generator centres
  that box rather than the viewBox.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" width="42" height="42">
  <rect x="6" y="9" width="30" height="9" rx="4.5" fill="#2B33E8" />
  <rect x="6" y="23" width="18" height="9" rx="4.5" fill="#1E2499" />
  <circle cx="31.5" cy="27.5" r="4.5" fill="#2B33E8" />
</svg>
